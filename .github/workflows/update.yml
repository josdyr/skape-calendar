name: Update skape.ics

on:
  schedule:
    - cron: '17 6 * * *'  # daily at 06:17 UTC (~08:17 Oslo)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scrape + enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scrape.py

      - name: Commit enrichment cache if changed
        run: |
          if [[ -n "$(git status --porcelain data/enrichment.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/enrichment.json
            git commit -m "chore: update enrichment cache [skip ci]"
            git push
          else
            echo "No cache changes to commit."
          fi

      - name: Build site
        run: |
          mkdir -p _site
          mv skape.ics _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset=utf-8>
          <title>Skape kurskalender</title>
          <h1>Skape kurskalender (ICS)</h1>
          <p>Subscribe: <a href="skape.ics">skape.ics</a></p>
          <p>Source: <a href="https://www.skape.no/kurs/kurskalender">skape.no/kurs/kurskalender</a></p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
